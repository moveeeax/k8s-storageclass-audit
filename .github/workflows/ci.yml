name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Test
        run: python -m pytest
      - name: Audit the clean example (expects exit 0)
        run: k8s-storageclass-audit --input tests/fixtures/clean-cluster.json
      - name: Audit the broken example (expects exit 1)
        run: |
          set +e
          k8s-storageclass-audit --input examples/broken-cluster.json --format json
          code=$?
          set -e
          test "$code" -eq 1
